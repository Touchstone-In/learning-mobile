name: Android CI

on:
  push:
    branches: [staging, main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"
      - "distribution/**"
  pull_request:
    branches: [staging, main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "Using placeholder google-services.json"
          fi

      - name: Run unit tests and assemble debug test artifacts
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Test report summary
        if: always()
        run: |
          echo "##  Android Unit Test Results" >> $GITHUB_STEP_SUMMARY
          RESULTS=$(find app/build/test-results -name "*.xml" 2>/dev/null | head -5)
          for f in $RESULTS; do
            TESTS=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            echo "- Tests: ${TESTS:-0}, Failures: ${FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Android test APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  instrumented-tests:
    name: Instrumented & UI Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "Using placeholder google-services.json"
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Instrumented test report summary
        if: always()
        run: |
          echo "## Android Instrumented/UI Test Results" >> $GITHUB_STEP_SUMMARY
          RESULTS=$(find app/build -path "*androidTest-results*" -name "*.xml" 2>/dev/null | head -10)
          for f in $RESULTS; do
            TESTS=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            echo "- Tests: ${TESTS:-0}, Failures: ${FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
          done

  # Staging → Play Store internal testing track
  staging-release:
    name: Build & Upload to Internal Testing
    needs: [unit-tests, instrumented-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "Using placeholder google-services.json"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      - name: Build release AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Detect native debug symbols
        if: success()
        id: debug_symbols
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/outputs/native-debug-symbols/release/*.zip)

          if [ ${#files[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
            echo "Native debug symbols: ${files[0]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Native debug symbols: none generated for this build" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native debug symbols artifact
        if: success() && steps.debug_symbols.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-native-debug-symbols
          path: ${{ steps.debug_symbols.outputs.path }}
          retention-days: 30

      - name: Prepare Play release notes
        if: success()
        shell: bash
        run: |
          mkdir -p distribution/whatsnew
          NOTES_FILE="distribution/whatsnew/whatsnew-en-US"

          if [ -s "$NOTES_FILE" ]; then
            NOTES_CONTENT=$(cat "$NOTES_FILE")
          else
            NOTES_CONTENT=$(git log -1 --pretty=%s)
          fi

          NOTES_CONTENT=$(printf '%s' "$NOTES_CONTENT" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/^ //; s/ $//')
          NOTES_CONTENT=${NOTES_CONTENT:0:500}
          printf '%s\n' "$NOTES_CONTENT" > "$NOTES_FILE"

          echo "Prepared release notes:" >> $GITHUB_STEP_SUMMARY
          echo "$NOTES_CONTENT" >> $GITHUB_STEP_SUMMARY

      - name: Upload Play Store branding assets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-play-store-assets
          path: distribution/play-store/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Play Store (internal testing) with debug symbols
        if: success() && steps.debug_symbols.outputs.found == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.touchstoneinstitute.learningcompanion
          releaseFiles: app/build/outputs/bundle/release/*.aab
          debugSymbols: ${{ steps.debug_symbols.outputs.path }}
          track: internal
          status: draft
          whatsNewDirectory: distribution/whatsnew

      - name: Upload to Play Store (internal testing) without debug symbols
        if: success() && steps.debug_symbols.outputs.found != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.touchstoneinstitute.learningcompanion
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
          whatsNewDirectory: distribution/whatsnew

      - name: Release summary
        if: always()
        run: |
          echo "## Staging Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** staging" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ AAB uploaded to Play Store **internal testing** track" >> $GITHUB_STEP_SUMMARY
            echo "Internal testers will receive the update within ~10 minutes" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build or upload encountered issues" >> $GITHUB_STEP_SUMMARY
          fi

  # Main → Play Store production track
  production-release:
    name: Build & Release to Production
    needs: [unit-tests, instrumented-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "Using placeholder google-services.json"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      - name: Build release AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Detect native debug symbols
        if: success()
        id: debug_symbols
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/outputs/native-debug-symbols/release/*.zip)

          if [ ${#files[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
            echo "Native debug symbols: ${files[0]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Native debug symbols: none generated for this build" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native debug symbols artifact
        if: success() && steps.debug_symbols.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-native-debug-symbols
          path: ${{ steps.debug_symbols.outputs.path }}
          retention-days: 30

      - name: Prepare Play release notes
        if: success()
        shell: bash
        run: |
          mkdir -p distribution/whatsnew
          NOTES_FILE="distribution/whatsnew/whatsnew-en-US"

          if [ -s "$NOTES_FILE" ]; then
            NOTES_CONTENT=$(cat "$NOTES_FILE")
          else
            NOTES_CONTENT=$(git log -1 --pretty=%s)
          fi

          NOTES_CONTENT=$(printf '%s' "$NOTES_CONTENT" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/^ //; s/ $//')
          NOTES_CONTENT=${NOTES_CONTENT:0:500}
          printf '%s\n' "$NOTES_CONTENT" > "$NOTES_FILE"

          echo "Prepared release notes:" >> $GITHUB_STEP_SUMMARY
          echo "$NOTES_CONTENT" >> $GITHUB_STEP_SUMMARY

      - name: Upload Play Store branding assets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-play-store-assets
          path: distribution/play-store/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Play Store (production) with debug symbols
        if: success() && steps.debug_symbols.outputs.found == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.touchstoneinstitute.learningcompanion
          releaseFiles: app/build/outputs/bundle/release/*.aab
          debugSymbols: ${{ steps.debug_symbols.outputs.path }}
          track: production
          status: draft
          whatsNewDirectory: distribution/whatsnew

      - name: Upload to Play Store (production) without debug symbols
        if: success() && steps.debug_symbols.outputs.found != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.touchstoneinstitute.learningcompanion
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: draft
          whatsNewDirectory: distribution/whatsnew

      - name: Release summary
        if: always()
        run: |
          echo "## Production Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ AAB uploaded to Play Store **production** track" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build or upload encountered issues" >> $GITHUB_STEP_SUMMARY
          fi